services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
      POSTGRES_DB: incidents
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://incidents:incidents@db:5432/incidents
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "app.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://incidents:incidents@db:5432/incidents
    depends_on:
      db:
        condition: service_healthy
