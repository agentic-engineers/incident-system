name: pr

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: incidents
          POSTGRES_DB: incidents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidents"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app/ tests/
      - name: Unit + integration
        run: pytest tests/unit -q
        env:
          PYTHONPATH: .
      # NOTA: aun no hay gate de concurrencia aqui; el dia que exista un test
      # que reproduzca el issue #12, se vuelve obligatorio en este workflow.
      - name: Build image
        run: docker build -f deploy/Dockerfile -t incident-system:${{ github.sha }} .
